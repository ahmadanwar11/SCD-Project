<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medicine - Medicine Reminder System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>Medicine Reminder System</h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="add-patient.html">Add Patient</a>
                <a href="add-doctor.html">Add Doctor</a>
                <a href="add-medicine.html" class="active">Add Medicine</a>
                <a href="timeline.html">Timeline</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Add Medicine Reminder</h2>

            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="step active" id="step-indicator-1">
                    <div class="step-number">1</div>
                    <div class="step-label">Medicine Details</div>
                </div>
                <div class="step" id="step-indicator-2">
                    <div class="step-number">2</div>
                    <div class="step-label">Reminder Schedule</div>
                </div>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>

            <!-- Step 1: Medicine Details -->
            <form id="medicine-form-step1" class="form-step active">
                <h3>Step 1: Medicine Details</h3>

                <div class="form-group">
                    <label for="patient_id">Select Patient *</label>
                    <select id="patient_id" name="patient_id" required>
                        <option value="">Loading patients...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="doctor_id">Select Doctor *</label>
                    <select id="doctor_id" name="doctor_id" required>
                        <option value="">Loading doctors...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="medicine_name">Medicine Name *</label>
                    <input type="text" id="medicine_name" name="medicine_name" required placeholder="e.g., Aspirin, Paracetamol">
                </div>

                <div class="form-group">
                    <label for="dosage">Dosage *</label>
                    <input type="text" id="dosage" name="dosage" required placeholder="e.g., 500mg, 2 tablets">
                </div>

                <div class="form-group">
                    <label for="frequency">Frequency *</label>
                    <input type="text" id="frequency" name="frequency" required placeholder="e.g., 3 times a day, Every 8 hours">
                </div>

                <div class="form-group">
                    <label for="time">Time of Day</label>
                    <input type="text" id="time" name="time" placeholder="e.g., Morning, Afternoon, Night">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-primary" id="next-step-btn">Next Step</button>
                    <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>

            <!-- Step 2: Reminder Schedule -->
            <form id="medicine-form-step2" class="form-step">
                <h3>Step 2: Reminder Schedule</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="start_date">Start Date *</label>
                        <input type="date" id="start_date" name="start_date" required>
                    </div>

                    <div class="form-group">
                        <label for="end_date">End Date</label>
                        <input type="date" id="end_date" name="end_date">
                    </div>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="discontinued">Discontinued</option>
                    </select>
                </div>

                <div class="reminder-times-section">
                    <label>Add Reminder Times</label>
                    <div id="reminder-times-list">
                        <div class="reminder-time-item">
                            <input type="datetime-local" class="reminder-time-input" required>
                            <button type="button" class="btn-remove-time" onclick="removeReminderTime(this)">Remove</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary" id="add-reminder-time-btn">Add Another Time</button>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="prev-step-btn">Previous</button>
                    <button type="submit" class="btn btn-primary">Add Medicine & Reminders</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/medicine.js"></script>
</body>
</html>
