<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor - Medicine Reminder System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>Medicine Reminder System</h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="add-patient.html">Add Patient</a>
                <a href="add-doctor.html" class="active">Add Doctor</a>
                <a href="add-medicine.html">Add Medicine</a>
                <a href="timeline.html">Timeline</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Add New Doctor</h2>

            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>

            <form id="doctor-form">
                <div class="form-group">
                    <label for="name">Doctor Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="specialization">Specialization *</label>
                    <input type="text" id="specialization" name="specialization" required placeholder="e.g., Cardiologist, General Physician">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="hospital">Hospital/Clinic</label>
                    <input type="text" id="hospital" name="hospital" placeholder="Name of hospital or clinic">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Doctor</button>
                    <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/doctor.js"></script>
</body>
</html>
